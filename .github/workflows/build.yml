name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          echo "--- /Applications ---"
          ls -1 /Applications | grep -i xcode || true
          xcodebuild -version
          xcodebuild -showsdks | sed -n '1,40p'

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "${LATEST:-}" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -switch "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # pipefail + tee means the step fails exactly when xcodebuild does.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project MaiBot.xcodeproj \
            -scheme MaiBot \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
