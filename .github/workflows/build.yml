name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MaiBot
  PROJECT: MaiBot.xcodeproj
  BUNDLE: online.galmaster.maibot

jobs:
  simulator:
    name: Build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -switch "$LATEST/Contents/Developer"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-sim.log
      - name: Upload simulator log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-sim-log, path: build-sim.log, retention-days: 7 }

  screenshot:
    name: Screenshot on Simulator
    runs-on: macos-15
    needs: simulator
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shot]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -switch "$LATEST/Contents/Developer"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -5
      - name: Boot, install, screenshot
        timeout-minutes: 15
        env:
          GM_COOKIE: ${{ secrets.GM_TEST_COOKIE }}
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-2[6-9][0-9-]*" | tail -1)
          echo "runtime: $RUNTIME"
          xcrun simctl list runtimes | head -20
          if [ -z "$RUNTIME" ]; then echo "NO iOS 26 RUNTIME"; exit 1; fi
          DEVTYPE=$(xcrun simctl list devicetypes | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-1[0-9]" | tail -1)
          DEV=$(xcrun simctl create "MaiBotTest" "$DEVTYPE" "$RUNTIME")
          echo "device: $DEV"
          xcrun simctl boot "$DEV" || true
          for i in $(seq 1 90); do
            if xcrun simctl list devices | grep -q "$DEV.*Booted"; then echo "simulator booted"; break; fi
            sleep 2
          done
          APP="build/sim/Build/Products/Debug-iphonesimulator/MaiBot.app"
          test -d "$APP" || { echo "app missing"; ls -R build/sim/Build/Products || true; exit 1; }
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          for TAB in home manage chat logs settings bots room dark stats config plugins memory prompts files news; do
            echo "=== $TAB ==="
            SLEEP=8
            case "$TAB" in
              chat) SLEEP=12 ;;
              logs) SLEEP=10 ;;
              room) SLEEP=10 ;;
              stats) SLEEP=12 ;;
              config) SLEEP=12 ;;
              plugins) SLEEP=12 ;;
              memory) SLEEP=12 ;;
              prompts) SLEEP=12 ;;
              files) SLEEP=12 ;;
              news) SLEEP=12 ;;
            esac
            if [ "$TAB" = "chat" ]; then
              SIMCTL_CHILD_GM_TEST_CHAT_TEXT="你好，简单介绍一下你自己" SIMCTL_CHILD_GM_TEST_COOKIE="$GM_COOKIE" SIMCTL_CHILD_GM_TEST_TAB=chat xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE" || true
            elif [ "$TAB" = "dark" ]; then
              SIMCTL_CHILD_GM_TEST_THEME=dark SIMCTL_CHILD_GM_TEST_COOKIE="$GM_COOKIE" SIMCTL_CHILD_GM_TEST_TAB=home xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE" || true
            else
              SIMCTL_CHILD_GM_TEST_COOKIE="$GM_COOKIE" SIMCTL_CHILD_GM_TEST_TAB="$TAB" xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE" || true
            fi
            sleep "$SLEEP"
            xcrun simctl io "$DEV" screenshot "shot-$TAB.png" || true
          done
          ls -la shot-*.png || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: app-screenshots, path: "shot-*.png", retention-days: 14 }

  ipa:
    name: Package unsigned IPA
    runs-on: macos-15
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shot]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -switch "$LATEST/Contents/Developer"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/MaiBot.xcarchive \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=NO build 2>&1 | tee archive.log
      - name: Package Payload into .ipa
        run: |
          set -euo pipefail
          APP="build/MaiBot.xcarchive/Products/Applications/MaiBot.app"
          rm -rf build/payload; mkdir -p build/payload/Payload
          cp -R "$APP" build/payload/Payload/
          ( cd build/payload && zip -qry ../MaiBot-unsigned.ipa Payload )
          ls -lh build/MaiBot-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with: { name: MaiBot-unsigned-ipa, path: build/MaiBot-unsigned.ipa, retention-days: 30 }
      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: archive-log, path: archive.log, retention-days: 7 }